# 我的服务台 · nginx 反向代理配置
# 手动部署：复制到 /etc/nginx/sites-available/service-hub 并软链到 sites-enabled/
#   （CentOS 等无 sites-available 的发行版，直接放 /etc/nginx/conf.d/service-hub.conf）
# 或者直接跑 `bash deploy/install.sh --nginx` 自动完成安装与端口替换。

# 登录接口限速区（防爆破）：每 IP 每分钟 5 次，突发允许 8 次
limit_req_zone $binary_remote_addr zone=hub_login:10m rate=5r/m;

# WebSocket 升级头（当前业务没用到，保留以便将来扩展）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name _;                 # ← 有域名改成你的域名（install.sh --domain 会自动替换）

    server_tokens off;             # 隐藏 nginx 版本号
    client_max_body_size 4m;

    # 登录接口单独限速
    location = /api/login {
        limit_req zone=hub_login burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:7788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查放行（供监控探活，不写访问日志）
    location = /api/healthz {
        access_log off;
        proxy_pass http://127.0.0.1:7788;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:7788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# 安全响应头 / gzip / 缓存：Node 服务端已统一处理，这里不重复加，避免重复头。

# 上 HTTPS（有域名后执行）：
#   apt install -y certbot python3-certbot-nginx   （CentOS: dnf install -y certbot python3-certbot-nginx）
#   certbot --nginx -d hub.example.com
